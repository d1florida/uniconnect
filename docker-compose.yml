services:
  postgres:
    image: postgres:16
    container_name: uniconnect-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uniconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniconnect}
      POSTGRES_DB: ${POSTGRES_DB:-uniconnect}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
